<div class="login-container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Logowanie</mat-card-title>
      <mat-card-subtitle>Finance Tracker</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form"
            (ngSubmit)="onSubmit()">

        <mat-form-field appearance="outline"
                        class="full-width">
          <mat-label>Email</mat-label>
          <input matInput
                 type="email"
                 formControlName="email" />
          @if (form.get('email')?.invalid && form.get('email')?.touched) {
          <mat-error>Podaj poprawny email</mat-error>
          }
        </mat-form-field>

        <mat-form-field appearance="outline"
                        class="full-width">
          <mat-label>Hasło</mat-label>
          <input matInput
                 type="password"
                 formControlName="password" />
          @if (form.get('password')?.invalid && form.get('password')?.touched) {
          <mat-error>Hasło min. 6 znaków</mat-error>
          }
        </mat-form-field>

        @if (error()) {
        <p class="error-message">{{ error() }}</p>
        }

        <button mat-raised-button
                color="primary"
                type="submit"
                class="full-width"
                [disabled]="loading()">
          @if (loading()) {
          <mat-spinner diameter="20" />
          } @else {
          Zaloguj się
          }
        </button>

      </form>
    </mat-card-content>

    <mat-card-actions>
      <p>Nie masz konta? <a routerLink="/register">Zarejestruj się</a></p>
    </mat-card-actions>
  </mat-card>
</div>
